name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe: weak-ca-check
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: weak-ca-check.exe
          - runner: macos-14
            target: aarch64-apple-darwin
            exe: weak-ca-check
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --target ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo +1.94.0 test --release --locked --target ${{ matrix.target }}
      - run: cargo +1.94.0 build --release --locked --target ${{ matrix.target }}
      - run: cargo +1.94.0 run --release --locked --example license-notices -- --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$EXE" "dist/$EXE"
          cp README.md LICENSE dist/
          cp -R docs dist/
          cd dist
          if [[ "$EXE" == *.exe ]]; then
            7z a "weak-ca-check-$TARGET.zip" "$EXE" README.md LICENSE docs THIRD_PARTY_NOTICES.txt
          else
            tar -czf "weak-ca-check-$TARGET.tar.gz" "$EXE" README.md LICENSE docs THIRD_PARTY_NOTICES.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: cargo +1.94.0 build --release --locked
      - run: cargo +1.94.0 test --release --locked
      - run: target/release/weak-ca-check build-db --output dist/all-100k-v1.wkdb
      - run: target/release/weak-ca-check inspect dist/all-100k-v1.wkdb > dist/all-100k-v1.manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database
          path: |
            dist/all-100k-v1.wkdb
            dist/all-100k-v1.manifest.json
  publish:
    needs: [binaries, database]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip *.wkdb *.manifest.json > SHA256SUMS
          gh release create "$TAG" ./* --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
