name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe: weak-ca-check
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: weak-ca-check.exe
          - runner: macos-14
            target: aarch64-apple-darwin
            exe: weak-ca-check
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --target ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo +1.94.0 test --release --locked --target ${{ matrix.target }}
      - run: cargo +1.94.0 build --release --locked --target ${{ matrix.target }}
      - run: python scripts/license_notices.py --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$EXE" "dist/$EXE"
          cp README.md LICENSE dist/
          cp -R docs dist/
          cd dist
          if [[ "$EXE" == *.exe ]]; then
            7z a "weak-ca-check-$TARGET.zip" "$EXE" README.md LICENSE docs THIRD_PARTY_NOTICES.txt
          else
            tar -czf "weak-ca-check-$TARGET.tar.gz" "$EXE" README.md LICENSE docs THIRD_PARTY_NOTICES.txt
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
  packs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: cargo +1.94.0 build --release --locked
      - run: python3 scripts/build_starter.py
      - run: python3 scripts/build_patterns.py
      - name: Independent recipe verification
        run: |
          python3 -m venv /tmp/weak-ca-reference
          /tmp/weak-ca-reference/bin/pip install 'cryptography==50.0.0'
          /tmp/weak-ca-reference/bin/python scripts/verify_reference.py
          /tmp/weak-ca-reference/bin/python scripts/verify_reference.py --packs dist/patterns-100k-v1
      - run: tar -czf dist/starter-100k-v1.tar.gz -C dist starter-100k-v1
      - run: tar -czf dist/patterns-100k-v1.tar.gz -C dist patterns-100k-v1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: starter-packs
          path: dist/*-v1.tar.gz
  publish:
    needs: [binaries, packs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$TAG" ./* --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
