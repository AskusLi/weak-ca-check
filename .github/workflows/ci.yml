name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.94.0 test --release --locked
